# Dashboard grid layout.
# Position CHART node meta.uuid must match the chart uuid in superset/charts/.
# Widths sum to 12 per row (Superset Bootstrap grid).
position:
  DASHBOARD_VERSION_KEY: v2
  ROOT_ID:
    children:
    - GRID_ID
    id: ROOT_ID
    type: ROOT
  GRID_ID:
    children:
    - ROW-row1
    - ROW-row2
    - ROW-row3
    id: GRID_ID
    type: GRID
  # Row 1 — scorecard + line chart
  ROW-row1:
    children:
    - CHART-vol
    - CHART-line
    id: ROW-row1
    meta:
      background: BACKGROUND_TRANSPARENT
    type: ROW
  CHART-vol:
